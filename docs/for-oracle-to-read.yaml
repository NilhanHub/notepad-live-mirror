title: "For Oracle to Read"
repo: "Notepad Live Mirror"
truth_source: "live-running-notepad-session"
normal_bridge_mode: "non_visual_session_state"
save_bridge_mode: "bounded_visual_writeback"
current_objective: "Prove a local-first mirror of the user's existing Windows 11 Notepad session without launching new Notepad instances, while keeping snapshot/search/query non-visual, exposing truthful diagnostics, and preserving SAN resumability."
current_failure_or_uncertainty: "Snapshot/search/query are intended to be non-visual and instance-safe. Save remains a bounded UIA write-back path until a persistent-session-safe live write is re-proven under this pass with explicit evidence."
include:
  - "AGENTS.md"
  - "README.md"
  - "docs/for-oracle-to-read.md"
  - "docs/for-oracle-to-read.yaml"
  - "san/**"
  - "backend/src/**"
  - "frontend/src/**"
  - "bridge/**"
  - "scripts/**"
  - "artifacts/latest/oracle-bundle-command.txt"
  - "artifacts/latest/oracle-surface-proof.json"
  - "artifacts/latest/launcher-status.json"
  - "artifacts/latest/desktop-shortcut.json"
  - "artifacts/latest/desktop-shortcut-launch.json"
  - "artifacts/latest/selector-inspection.sanitized.json"
  - "artifacts/latest/verification-run.txt"
  - "artifacts/latest/known-good-run.txt"
  - "artifacts/latest/real-user-audit.txt"
exclude:
  - "node_modules/**"
  - "frontend/dist/**"
  - "backend/dist/**"
  - ".git/**"
  - ".env*"
  - "artifacts/latest/snapshot-live.json"
  - "artifacts/latest/selector-inspection.json"
  - "artifacts/runs/**/files/raw/**"
  - "artifacts/runs/**/snapshot*.json"
sanitize:
  - "Prefer sanitized run artifacts over raw live Notepad text."
  - "Treat tab titles, tab bodies, file paths, and selected-document content as sensitive unless already redacted."
  - "Bundle hashes, counts, identities, request IDs, bridge mode, and bounded snippets instead of full live text whenever possible."
  - "If a bug requires quoting live content, quote the smallest useful excerpt and mark it as sensitive."
reproduction_steps:
  - "Open the user's existing Windows 11 Notepad session. Do not launch a new Notepad instance."
  - "Run run-local.cmd or scripts/dev.ps1 and confirm the launcher reports the actual bound localhost port."
  - "Run npm run inspect:notepad to capture a non-visual live snapshot report for the current session."
  - "Run npm run smoke:live to execute the no-new-instance, read-only real-user verification bundle."
  - "Run npm run audit:real to emit a sanitized real-user audit bundle."
  - "Run npm run verify:headless for browser-side proof of diagnostics, search/query, wrap, and empty-state UI."
evidence_sufficient:
  - "No packaged command increases the Notepad process count or visible Notepad window count."
  - "Snapshot/search/query runs record selectionActionsDuringSnapshot = 0, focusChangedDuringSnapshot = false, windowActivatedDuringSnapshot = false, and zero new Notepad deltas."
  - "The app binds to the actual runtime port shown by /api/health, scripts/dev.ps1, and the in-app diagnostics drawer."
  - "Oracle instructions match the generated markdown, YAML, API diagnostics, and artifacts/latest/oracle-bundle-command.txt."
  - "Save is only claimed when a live write-back is followed by an exact non-visual re-read equality check; otherwise it must remain bounded or unproven."
oracle_command: "npx -y @steipete/oracle --render --render-plain -p \"Review the Notepad Live Mirror repo using docs/for-oracle-to-read.md. Focus on no-new-Notepad-instance compliance, non-visual snapshot/search/query proof, bounded save semantics, diagnostics truth, shortcut proof, and the latest sanitized artifacts.\" --file \"AGENTS.md\" --file \"README.md\" --file \"docs/for-oracle-to-read.md\" --file \"docs/for-oracle-to-read.yaml\" --file \"san/**\" --file \"backend/src/**\" --file \"frontend/src/**\" --file \"bridge/**\" --file \"scripts/**\" --file \"artifacts/latest/oracle-bundle-command.txt\" --file \"artifacts/latest/oracle-surface-proof.json\" --file \"artifacts/latest/launcher-status.json\" --file \"artifacts/latest/desktop-shortcut.json\" --file \"artifacts/latest/desktop-shortcut-launch.json\" --file \"artifacts/latest/selector-inspection.sanitized.json\" --file \"artifacts/latest/verification-run.txt\" --file \"artifacts/latest/known-good-run.txt\" --file \"artifacts/latest/real-user-audit.txt\" --file \"!node_modules/**\" --file \"!frontend/dist/**\" --file \"!backend/dist/**\" --file \"!.git/**\" --file \"!.env*\" --file \"!artifacts/latest/snapshot-live.json\" --file \"!artifacts/latest/selector-inspection.json\" --file \"!artifacts/runs/**/files/raw/**\" --file \"!artifacts/runs/**/snapshot*.json\""
paths:
  source: "backend/src/diagnostics/oracleManifest.ts"
  doc: "docs/for-oracle-to-read.md"
  yaml: "docs/for-oracle-to-read.yaml"
  command: "artifacts/latest/oracle-bundle-command.txt"
runtime:
  public_snapshot: "sanitized example; live values are generated locally and remain untracked"
  run_id: "<runtime-generated>"
  actual_port: 0
  latest_artifacts_dir: "artifacts/runs/<latest-server-run>"
  latest_verification_run_dir: "artifacts/runs/<latest-real-user-smoke>"
  latest_known_good_run_dir: "artifacts/runs/<latest-real-user-smoke>"
  latest_real_audit_dir: "artifacts/runs/<latest-real-user-audit>"
  last_snapshot_request_id: "<runtime-generated>"
  last_save_request_id: null
  last_bridge_action_id: "<runtime-generated>"
